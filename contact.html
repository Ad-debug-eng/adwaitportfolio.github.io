<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Adwait Ahirekar</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #0b0b0b;
      color: #fff;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 50px;
      background: rgba(0, 0, 0, 0.85);
      position: sticky;
      top: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
    }

    nav a:hover, nav a.active {
      color: #00bcd4;
    }

    .contact-header {
      text-align: center;
      padding: 100px 20px 50px;
      background-color: #000;
    }

    .contact-header h1 {
      font-size: 60px;
      margin: 0;
      color: #f8f8f8;
    }

    .contact-container {
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      flex-wrap: wrap;
      padding: 50px 10%;
      background-color: #111;
    }

    .contact-box {
      width: 45%;
      min-width: 300px;
    }

    .contact-box h2 {
      color: #ddd;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: none;
    }

    .btn-send {
      background: #ff465a;
      border: none;
      padding: 12px 25px;
      color: #fff;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-send:hover {
      background: #00bcd4;
    }

    .contact-info {
      text-align: left;
    }

    .contact-info p {
      font-size: 16px;
      margin: 10px 0;
    }

    .linkedin-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #00bcd4;
      margin-top: 10px;
    }

    .linkedin-link img {
      width: 28px;
      height: 28px;
      margin-right: 8px;
    }

    footer {
      background-color: #0d0d0d;
      color: #ccc;
      text-align: center;
      padding: 20px 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <section class="contact-header">
    <h1>CONTACT ME</h1>
  </section>

  <section class="contact-container">
    <div class="contact-box">
      <h2>LET'S TALK</h2>
      <form>
        <input type="text" placeholder="Your Name *" required>
        <input type="email" placeholder="Email *" required>
        <textarea placeholder="Message *" required></textarea>
        <button class="btn-send">SEND MESSAGE</button>
      </form>
    </div>

    <div class="contact-box contact-info">
      <h2>CONTACT INFO</h2>
      <p><strong>Email:</strong> adwait.ahirekar23@gmail.com</p>
      <a href="www.linkedin.com/in/adwait-ahirekar"
         target="_blank"
         class="linkedin-link">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn Logo">
        LinkedIn
      </a>
    </div>
  </section>

  <footer>
    <p>© 2025 Adwait Ahirekar | All Rights Reserved</p>
  </footer>
</body>
</html>
