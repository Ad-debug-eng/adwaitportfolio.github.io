<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume | Adwait Ahirekar</title>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    /* Navbar copied exactly from index.html */
    nav{
      width:calc(100% - 40px);
      margin:12px auto;
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:12px 18px;border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.03));
      border:1px solid rgba(255,255,255,0.02);
      position:sticky;top:12px;z-index:50;
      backdrop-filter: blur(6px);
    }
    .brand{font-weight:700;color:#e63946;letter-spacing:0.6px}
    .navlinks{display:flex;gap:18px}
    .navlinks a{color:#b6b9bb;font-weight:600;padding:8px;border-radius:8px;text-decoration:none}
    .navlinks a:hover{color:#fff;background:rgba(255,255,255,0.02)}

    /* Banner Section */
    .hero {
      background: url("https://www.steinermachine.ch/fileadmin/_processed_/1/3/csm_Neumaschinen_Bilder_large_98689b1f8c.webp") no-repeat center center/cover;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .btn-download {
      position: relative;
      z-index: 2;
      display: inline-block;
      margin-top: 20px;
      background-color: #00bcd4;
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-download:hover {
      background-color: #00a0b2;
      transform: scale(1.05);
    }

    iframe {
      width: 80%;
      height: 90vh;
      border: none;
      margin-top: 30px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <nav role="navigation" aria-label="Primary navigation">
    <div class="brand">Adwait Ahirekar</div>
    <div class="navlinks" role="menubar">
      <a href="index.html" role="menuitem">Home</a>
      <a href="resume.html" role="menuitem" style="color:#fff;background:rgba(255,255,255,0.02)">Resume</a>
      <a href="projects.html" role="menuitem">Projects</a>
      <a href="contact.html" role="menuitem">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>RESUME</h1>
    <a class="btn-download"
       href="https://drive.google.com/file/d/1UJL-lbhDlOHUTnEjhxy3qaskgC-6vAJg/view?usp=sharing"
       target="_blank">
       DOWNLOAD RESUME PDF
    </a>
  </section>

  <iframe src="https://drive.google.com/file/d/1UJL-lbhDlOHUTnEjhxy3qaskgC-6vAJg/preview"></iframe>
</body>
</html>
